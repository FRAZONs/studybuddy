server {
    listen 8080;
    server_name _;

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/auth/ {
        proxy_pass http://studybuddy-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/auth {
        proxy_pass http://studybuddy-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/notes {
        proxy_pass http://studybuddy-notes:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/search {
        proxy_pass http://studybuddy-search:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/recommendations {
        proxy_pass http://studybuddy-recommendations:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/chat {
        proxy_pass http://studybuddy-tutor:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 50s;
    }

    location / {
        return 404;
    }
}
