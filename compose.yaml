services:
  studybuddy-notes:
    image: studybuddy-notes:local
    build:
      context: ./backend
      args:
        SERVICE: notes
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      DATABASE_PATH: /data/studybuddy.db
    volumes:
      - studybuddy-notes-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  studybuddy-search:
    image: studybuddy-search:local
    build:
      context: ./backend
      args:
        SERVICE: search
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      NOTES_SERVICE_URL: http://studybuddy-notes:8000
    depends_on:
      studybuddy-notes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  studybuddy-recommendations:
    image: studybuddy-recommendations:local
    build:
      context: ./backend
      args:
        SERVICE: recommendations
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  studybuddy-tutor:
    image: studybuddy-tutor:local
    build:
      context: ./backend
      args:
        SERVICE: tutor
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  studybuddy-auth:
    image: studybuddy-auth:local
    build:
      context: ./backend
      args:
        SERVICE: auth
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_DATABASE_PATH: /data/auth.db
    volumes:
      - studybuddy-auth-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  studybuddy-gateway:
    image: nginxinc/nginx-unprivileged:alpine
    depends_on:
      studybuddy-notes:
        condition: service_healthy
      studybuddy-search:
        condition: service_healthy
      studybuddy-recommendations:
        condition: service_healthy
      studybuddy-tutor:
        condition: service_healthy
      studybuddy-auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./backend/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      studybuddy-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  studybuddy-notes-data:
  studybuddy-auth-data:
