apiVersion: v1
kind: Namespace
metadata:
  name: studybuddy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studybuddy-config
  namespace: studybuddy
data:
  DATABASE_PATH: /data/studybuddy.db
  AUTH_DATABASE_PATH: /data/auth.db
  NOTES_SERVICE_URL: http://studybuddy-notes:8000
  GEMINI_MODEL: gemini-3.5-flash-lite
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studybuddy-gateway-config
  namespace: studybuddy
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location /api/auth/ {
            proxy_pass http://studybuddy-auth:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location = /api/auth {
            proxy_pass http://studybuddy-auth:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/notes {
            proxy_pass http://studybuddy-notes:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location /api/search {
            proxy_pass http://studybuddy-search:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location /api/recommendations {
            proxy_pass http://studybuddy-recommendations:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location /api/chat {
            proxy_pass http://studybuddy-tutor:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 50s;
        }
        location / {
            return 404;
        }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studybuddy-notes-data
  namespace: studybuddy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studybuddy-auth-data
  namespace: studybuddy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studybuddy-notes
  namespace: studybuddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: studybuddy-notes
  template:
    metadata:
      labels:
        app: studybuddy-notes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: notes
          image: studybuddy-notes:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: studybuddy-config
          env:
            - name: AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: studybuddy-secrets
                  key: AUTH_TOKEN_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: studybuddy-notes-data
---
apiVersion: v1
kind: Service
metadata:
  name: studybuddy-notes
  namespace: studybuddy
spec:
  selector:
    app: studybuddy-notes
  ports:
    - name: http
      port: 8000
      targetPort: http
---
