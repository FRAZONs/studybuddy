---
apiVersion: v1
kind: Deployment
metadata:
  name: studybuddy-gateway
  namespace: studybuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studybuddy-gateway
  template:
    metadata:
      labels:
        app: studybuddy-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: gateway
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: studybuddy-gateway-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: studybuddy-gateway
  namespace: studybuddy
spec:
  selector:
    app: studybuddy-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
