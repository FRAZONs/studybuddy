              valueFrom:
                secretKeyRef:
                  name: studybuddy-secrets
                  key: AUTH_TOKEN_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
